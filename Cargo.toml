[package]
name = "vitals-machines"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
description = "Host vital signs and a recovery machine that waits for them to hold before calling it recovered"
repository = "https://github.com/seuros/vitals_machines"
readme = "README.md"
exclude = [
    "src/**/tests.rs",
    "src/tests/",
    "tests/",
    ".github/",
    ".dictate.toml",
    ".gitignore",
    "mise.toml",
    "release-please-config.json",
    ".release-please-manifest.json",
]
keywords = ["thermal", "battery", "recovery", "hysteresis", "no-std"]
categories = ["no-std", "hardware-support", "os"]

[features]
default = []
## Fresh host probes: power, thermals, form factor, task storage, indexers.
probe = ["dep:libc", "dep:serde", "dep:objc2-foundation"]

[dependencies]
feedback-machines = ">=0.7"
periscope-machines = ">=0.5"
libc = { version = "0.2.191", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSProcessInfo"], optional = true }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[package.metadata.docs.rs]
features = ["probe"]

[lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
